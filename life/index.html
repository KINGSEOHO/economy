<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한평생 가계부</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="여덟 살 첫 용돈부터 마지막 장부까지, 돈과 선택으로 한평생을 살아 보는 5학년용 경제 인생 시뮬레이션.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 가계부 공책 — 왼쪽은 올해의 장(사건·선택·경제 노트·가계부 줄), 오른쪽은 통장과 돈 나누기 */
:root {
  --desk: #E4E9E1;
  --paper: #FBFCF7;
  --rule: #D3DDD0;
  --margin: #E8A69C;
  --ink: #1C2A31;
  --muted: #5B6B6D;
  --plus: #1D5CAB;
  --minus: #C4372A;
  --hl: #FFE45A;
  --hl-ink: #3A3000;
  --stamp: #C4372A;
  --gold: #B8860B;
  --ok: #23875A;
  --s-happy: #E07F12;
  --s-hp: #23875A;
  --s-learn: #1D5CAB;
  --s-credit: #7A4CB3;
  --j-spend: #E07F12;
  --j-save: #1D5CAB;
  --j-grow: #23875A;
  --j-give: #C94F86;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #0F1518; --paper: #172126; --rule: #26353B; --margin: #6E3A34; --ink: #E4ECE9; --muted: #93A4A5;
    --plus: #73A9F2; --minus: #F08372; --hl: #E3C537; --hl-ink: #241E00; --stamp: #F08372; --gold: #E2B64A; --ok: #4FBF86;
    --s-happy: #F2A34A; --s-hp: #4FBF86; --s-learn: #73A9F2; --s-credit: #B38BEA;
    --j-spend: #F2A34A; --j-save: #73A9F2; --j-grow: #4FBF86; --j-give: #EE86B3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #0F1518; --paper: #172126; --rule: #26353B; --margin: #6E3A34; --ink: #E4ECE9; --muted: #93A4A5;
  --plus: #73A9F2; --minus: #F08372; --hl: #E3C537; --hl-ink: #241E00; --stamp: #F08372; --gold: #E2B64A; --ok: #4FBF86;
  --s-happy: #F2A34A; --s-hp: #4FBF86; --s-learn: #73A9F2; --s-credit: #B38BEA;
  --j-spend: #F2A34A; --j-save: #73A9F2; --j-grow: #4FBF86; --j-give: #EE86B3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--desk); color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.6;
  padding-block: 14px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--plus); }
:focus-visible { outline: 3px solid var(--plus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.plus { color: var(--plus); } .minus { color: var(--minus); }
.wrap { max-width: 1160px; margin: 0 auto; display: grid; gap: 14px; }
body, p, .choice, .note { word-break: keep-all; overflow-wrap: break-word; }

/* 상단 */
.top { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.seal { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; transform: rotate(-10deg); }
.logo h1 { font-size: 30px; }
.logo small { display: block; color: var(--muted); font-size: 13px; }
.tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.btn {
  border: 2px solid var(--ink); background: var(--paper); border-radius: 10px; padding: 8px 14px;
  font-weight: 700; display: inline-flex; align-items: center; gap: 6px; transition: transform .05s; text-decoration: none; color: var(--ink);
}
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 5px 11px; font-size: 14px; border-width: 1.5px; }
.btn.pri { background: var(--ink); color: var(--paper); }
.btn.ghost { border-color: var(--rule); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 공책 종이 */
.sheet {
  position: relative; background: var(--paper); border-radius: 6px; border: 1px solid var(--rule);
  box-shadow: 0 1px 0 var(--rule), 0 10px 26px -18px rgba(0,0,0,.45);
  padding: 22px 22px 22px 52px;
  background-image: linear-gradient(90deg, transparent 36px, var(--margin) 36px, var(--margin) 38px, transparent 38px),
                    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  min-width: 0;
}
.sheet.plain { background-image: none; padding: 20px; }
.eyebrow { font-weight: 700; font-size: 13px; letter-spacing: .08em; color: var(--muted); }

/* 시작 화면 */
.start { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.hero h2 { font-size: clamp(44px, 8vw, 88px); line-height: 1; margin: 6px 0 12px; }
.hero h2 em { font-style: normal; color: var(--minus); }
.hero .lead { font-size: 18px; max-width: 30em; color: var(--muted); }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
.how div { border: 1.5px dashed var(--rule); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); background: var(--paper); }
.how b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--ink); }
.namerow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0 14px; }
.namerow input { width: 200px; max-width: 100%; border: 2px solid var(--ink); border-radius: 10px; padding: 8px 12px; background: var(--paper); }
.dist { display: grid; gap: 8px; margin-top: 10px; }
.drow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 46px; gap: 10px; align-items: center; font-size: 15px; }
.dbar { height: 14px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.dbar i { display: block; height: 100%; background: var(--ink); }
.small { font-size: 14px; color: var(--muted); }
.lives { display: grid; gap: 4px; margin-top: 8px; font-size: 14px; }
.lives div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--rule); padding: 3px 0; }
.mission { display: grid; gap: 6px; margin-top: 4px; font-size: 15px; }
.mission li { margin-left: 1.1em; }

/* 출생 기록 */
.birth { display: grid; gap: 14px; }
.birth .bname { font-size: clamp(40px, 7vw, 64px); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 18px; }
.facts small { display: block; color: var(--muted); font-size: 13px; }
.facts b { font-size: 18px; }
.tierchip { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--hl); color: var(--hl-ink); font-weight: 700; }

/* 게임 화면 */
.game { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.left { display: grid; gap: 14px; min-width: 0; }
.strip { display: flex; gap: 3px; align-items: flex-end; overflow-x: auto; padding-bottom: 4px; }
.strip i { flex: 1 0 12px; height: 12px; border-radius: 2px; background: var(--rule); position: relative; }
.strip i.done { background: var(--ink); opacity: .55; }
.strip i.ev { height: 18px; }
.strip i.cur { background: var(--minus); opacity: 1; }
.stamp-date { display: inline-flex; gap: 8px; align-items: baseline; border: 2px solid var(--stamp); color: var(--stamp); border-radius: 6px; padding: 1px 10px; font-family: var(--f-num); font-size: 14px; font-weight: 600; transform: rotate(-2deg); }
.event h2 { font-size: clamp(28px, 4vw, 40px); margin: 10px 0 8px; }
.event .text { display: grid; gap: 4px; font-size: 18px; line-height: 32px; }
.event .text .q { color: var(--plus); }
.term { border-bottom: 2px dotted var(--plus); cursor: help; font-weight: 700; }
.gloss { margin-top: 10px; border: 1.5px dashed var(--plus); border-radius: 10px; padding: 8px 12px; background: var(--paper); font-size: 14.5px; line-height: 1.55; display: grid; gap: 3px; }
.gloss b { color: var(--plus); margin-right: 6px; }
.gloss .on { background: var(--hl); color: var(--hl-ink); border-radius: 4px; }
.gloss .on b { color: var(--hl-ink); }
.proj { border-collapse: collapse; font-size: 15px; margin: 6px 0 2px; background: var(--paper); }
.proj th, .proj td { border: 1px solid var(--rule); padding: 3px 10px; text-align: right; line-height: 1.6; }
.proj th:first-child, .proj td:first-child { text-align: left; }
.proj td { font-family: var(--f-num); font-size: 14px; }
.choices { display: grid; gap: 8px; margin-top: 16px; }
.choice {
  text-align: left; border: 2px solid var(--ink); background: var(--paper); border-radius: 10px; padding: 10px 14px;
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 17px;
}
.choice .k { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; font-family: var(--f-num); font-size: 13px; }
.choice:hover:not(:disabled) { background: var(--hl); color: var(--hl-ink); border-color: var(--hl-ink); }
.choice:hover:not(:disabled) .k { border-color: var(--hl-ink); }
.choice .tag { font-family: var(--f-num); font-size: 13px; white-space: nowrap; }
.choice .need { grid-column: 2 / -1; font-size: 13px; color: var(--muted); margin-top: -4px; }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.think { margin-top: 12px; font-size: 15px; color: var(--muted); }
.think b { color: var(--ink); }
.result { margin-top: 16px; display: grid; gap: 10px; }
.result .r { font-size: 18px; line-height: 32px; }
.oc { font-size: 15.5px; border-left: 4px solid var(--hl); padding: 2px 10px; background: var(--paper); }
.oc b { margin-right: 6px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-family: var(--f-num); font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 999px; border: 1.5px solid currentColor; }
.note { border: 2px solid var(--ink); border-radius: 10px; padding: 12px 14px; background: var(--paper); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; }
.note .ns { width: 60px; height: 60px; border-radius: 50%; border: 3px solid var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-size: 13px; line-height: 1.1; padding: 4px; transform: rotate(-8deg); }
.note.new .ns { animation: thump .5s cubic-bezier(.3,1.6,.5,1); }
.note b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.note p { font-size: 15.5px; line-height: 1.6; }
.note .nw { display: inline-block; font-size: 12px; font-weight: 700; color: var(--paper); background: var(--stamp); border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; }
.note .core { display: inline-block; font-size: 12px; font-weight: 700; color: var(--plus); border: 1.5px solid var(--plus); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
@keyframes thump { from { transform: scale(2.2) rotate(-20deg); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
.quiz { border: 2px dashed var(--gold); border-radius: 10px; padding: 12px 14px; background: var(--paper); display: grid; gap: 8px; }
.quiz h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 18px; color: var(--gold); }
.quiz .qq { font-size: 17px; }
.quiz .opts { display: grid; gap: 6px; }
.quiz .opt { text-align: left; border: 1.5px solid var(--ink); background: var(--paper); border-radius: 8px; padding: 7px 12px; font-size: 16px; }
.quiz .opt:hover:not(:disabled) { background: var(--hl); color: var(--hl-ink); }
.quiz .opt.right { border-color: var(--ok); background: var(--ok); color: var(--paper); }
.quiz .opt.wrong { border-color: var(--minus); color: var(--minus); text-decoration: line-through; }
.quiz .opt:disabled { cursor: default; }
.quiz .fb { font-size: 15.5px; }
.quiz .fb b.y { color: var(--ok); } .quiz .fb b.n { color: var(--minus); }
.nextrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; }

/* 가계부 줄 */
.ledger { padding: 14px 18px 14px 52px; }
.ledger h3 { font-size: 18px; margin-bottom: 4px; }
.lrows { display: grid; font-size: 14px; max-height: 330px; overflow-y: auto; }
.lrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 118px; gap: 8px; align-items: baseline; line-height: 32px; min-height: 32px; }
.lrow .y { font-family: var(--f-num); color: var(--muted); font-size: 13px; }
.lrow .d { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .m { font-family: var(--f-num); text-align: right; font-size: 13.5px; font-weight: 600; }
.lrow.in { animation: write .3s ease-out; }
.lrow.bad .d { color: var(--minus); }
.lrow.good .d { color: var(--plus); }
@keyframes write { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

/* 오른쪽 */
.side { display: grid; gap: 14px; position: sticky; top: 12px; min-width: 0; }
.side > * { min-width: 0; }
.who { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.who h2 { font-size: 26px; }
.who .age { font-family: var(--f-num); font-weight: 600; }
.job { font-size: 14px; color: var(--muted); }
.total { margin-top: 10px; }
.total small { color: var(--muted); font-size: 13px; }
.total .big { font-family: var(--f-num); font-weight: 600; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; }
.total .real { font-size: 13px; color: var(--muted); }
.parts { display: grid; gap: 2px; margin-top: 8px; font-size: 14px; }
.parts div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--rule); }
.parts span:last-child { font-family: var(--f-num); font-size: 13px; }
.stats { display: grid; gap: 7px; }
.stat { display: grid; grid-template-columns: 38px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 14px; }
.stat .bar { height: 10px; border-radius: 5px; background: var(--rule); overflow: hidden; }
.stat .bar i { display: block; height: 100%; transition: width .5s; }
.stat b { font-family: var(--f-num); font-size: 13px; text-align: right; }
.stat small { grid-column: 2 / -1; font-size: 12px; color: var(--muted); margin-top: -6px; line-height: 1.35; }
.ramen { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-size: 14px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--rule); }
.ramen b { font-family: var(--f-num); }
.jars { display: grid; gap: 8px; }
.jars h3 { font-size: 18px; }
.jar { display: grid; grid-template-columns: 22px minmax(0, 1fr) 30px 46px 30px; gap: 6px; align-items: center; font-size: 15px; }
.jar .dot { width: 18px; height: 22px; border-radius: 4px 4px 7px 7px; border: 2px solid var(--jc); position: relative; overflow: hidden; }
.jar .dot i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--jc); }
.jar small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }
.jar .pct { font-family: var(--f-num); font-weight: 600; text-align: center; }
.pm { width: 30px; height: 28px; border-radius: 7px; border: 1.5px solid var(--ink); background: var(--paper); font-weight: 700; line-height: 1; }
.pm:disabled { opacity: .35; cursor: not-allowed; }
.mixbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; }
.mixbar i { display: block; height: 100%; }
.grow-to { display: grid; gap: 4px; font-size: 14px; }
.grow-to select { border: 1.5px solid var(--ink); border-radius: 8px; padding: 3px 6px; background: var(--paper); width: 100%; min-width: 0; }
.lockmsg { font-size: 13px; color: var(--muted); }

/* 오버레이 */
.ov { position: fixed; inset: 0; background: rgba(10, 16, 18, .55); z-index: 20; display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ovc { width: min(760px, 100%); max-height: 88vh; overflow: auto; }
.ovh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
.grid-st { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.st { border: 2px dashed var(--rule); border-radius: 12px; padding: 10px; text-align: center; font-size: 13px; color: var(--muted); position: relative; }
.st .ns { width: 52px; height: 52px; margin: 0 auto 6px; border-radius: 50%; border: 2.5px solid var(--rule); display: grid; place-items: center; font-family: var(--f-display); font-size: 12px; line-height: 1.1; color: var(--rule); padding: 3px; }
.st b { display: block; color: var(--ink); font-size: 15px; }
.st.on { border-style: solid; border-color: var(--stamp); }
.st.on .ns { border-color: var(--stamp); color: var(--stamp); transform: rotate(-8deg); }
.st.gold { border-color: var(--gold); }
.st.gold .ns { border-color: var(--gold); color: var(--gold); border-style: double; border-width: 4px; }
.st.off b { color: var(--muted); }
.st .lv { position: absolute; top: 6px; left: 8px; font-size: 11px; font-weight: 700; color: var(--plus); }

/* 엔딩 */
.ending { display: grid; gap: 16px; }
.endhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.endtitle { font-size: clamp(34px, 6vw, 56px); }
.bigstamp { width: 120px; height: 120px; border-radius: 50%; border: 5px double var(--stamp); color: var(--stamp); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-size: 19px; line-height: 1.15; transform: rotate(-12deg); animation: thump .6s cubic-bezier(.3,1.6,.5,1); padding: 10px; }
.endstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.endstats div { border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 10px; background: var(--paper); }
.endstats small { display: block; color: var(--muted); font-size: 12.5px; }
.endstats b { font-family: var(--f-num); font-size: 17px; }
.endstats em { display: block; font-style: normal; font-size: 12.5px; color: var(--muted); }
.copybox { border: 2px solid var(--ink); }
.copybox table { border-collapse: collapse; width: 100%; font-size: 15px; }
.copybox td { border-bottom: 1px dashed var(--rule); padding: 5px 4px; }
.copybox td:first-child { color: var(--muted); width: 44%; }
.copybox td:last-child { font-family: var(--f-num); font-weight: 600; }
.lessons { display: grid; gap: 8px; margin: 0; padding-left: 1.2em; font-size: 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { font-family: var(--f-num); font-size: 12px; fill: var(--muted); }
.chart .gl { stroke: var(--rule); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 20px; height: 3px; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.tl { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--ink); display: grid; gap: 4px; font-size: 14.5px; }
.tl li { position: relative; }
.tl li::before { content: ""; position: absolute; left: -20px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
.tl b { font-family: var(--f-num); font-size: 13px; color: var(--muted); margin-right: 6px; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
footer { text-align: center; font-size: 13px; color: var(--muted); }

@media (max-width: 920px) {
  .start, .game, .two { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .endstats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .how, .facts { grid-template-columns: minmax(0, 1fr); }

  G.chosen.push({ a: G.age, y: G.year, t: e.title, c: c.t, oc: c.oc || "" });
  G.cur.result = { r: res.r || c.r || "", diff: diffOf(before, after), k: c.k, k2: c.k2, newStamps, choice: c.t, oc: c.oc || "", quiz };
  G.phase = "result";
  saveGame(); render();
}
function answerQuiz(o) {
  const qz = G.cur && G.cur.result && G.cur.result.quiz; if (!qz || qz.picked != null) return;
  qz.picked = o; G.quizTried++;
  if (o === 0) {
    G.quizRight++; G.learn = clamp(G.learn + 2, 0, 100);
    const gold = store.get("hp.gold", []); if (!gold.includes(qz.k)) { gold.push(qz.k); store.set("hp.gold", gold); }
  }
  saveGame(); render();
}
const snap = g => ({ money: total(g), happy: g.happy, hp: g.hp, learn: g.learn, credit: g.credit });
function diffOf(a, b) { const d = {}; for (const k in a) { const v = b[k] - a[k]; if (Math.abs(v) >= (k === "money" ? 1 : .5)) d[k] = v; } return d; }

async function advance() {
  if (busy) return; busy = true;
  const g = G; g.curAge = g.age;
  const target = nextEventAge(g);
  const end = target == null ? 99 : target;
  g.phase = "years"; g.cur = null; render();
  const box = $("#lrows");
  while (g.age < end) {
    const { lines, crash } = yearSim(g);
    if (box) {
      for (const l of lines) box.insertAdjacentHTML("beforeend", rowHTML(l, true));
      box.scrollTop = box.scrollHeight;
      renderSide();
      await sleep(reduced ? 0 : 180);
    }
    // 노년의 마지막 장
    if (g.age >= 72 && !g.deathAge) {
      const p = .012 + (g.age - 72) * .007 + Math.max(0, 50 - g.hp) * .0025;
      if (rnd() < p || g.age >= 96) { g.deathAge = g.age; break; }
    }
    // 갑작스러운 일 (정해진 갈림길과 겹치면 건너뛴다)
    if (g.age >= end) continue;
    if (g.job && !g.retired && g.age >= 24) {
      const p = (crash ? .12 : .025) + (g.flags.has("obsolete") ? .05 : 0);
      if (rnd() < p && !g.used.includes("jobloss_" + g.age)) { g.used.push("jobloss_" + g.age); g.cur = { id: "jobloss", text: EV.jobloss.text(g) }; g.phase = "event"; break; }
    }
    if (g.age >= 30 && rnd() < (g.hp < 40 ? .12 : .018) && g.used.filter(x => x.startsWith("sick")).length < 3) {
      g.used.push("sick_" + g.age); g.cur = { id: "sick", text: EV.sick.text(g) }; g.phase = "event"; break;
    }
  }
  busy = false;
  if (g.deathAge) return finish();
  if (g.phase === "event" && g.cur) { saveGame(); return render(); }
  if (g.age >= end) {
    const slot = SCHED.find(([a]) => a === g.age);
    if (slot && beginAt(g, slot[1])) { saveGame(); return render(); }
    if (target == null) { g.deathAge = g.age; return finish(); }
    return advance();
  }
}

function finish() {
  const g = G;
  g.phase = "end";
  const real = total(g) / g.infl;
  const spendRatio = g.spent / Math.max(g.earned, 1);
  const conds = {
    debt: g.debt + g.mortgage > g.cash + g.inv.fund + g.inv.stock + g.inv.gold + g.inv.pension + g.house * .5 && g.debt > 1000e4 * g.infl,
    scammed: g.scams >= 2,
    founder: g.flags.has("founder"),
    jackpot: g.flags.has("riskWin") && g.inv.stock > total(g) * .4 && real > 12e8,
    giver: g.give / g.infl >= 1e8,
    wise: real >= 5e8 && g.happy >= 58,
    miser: real >= 5e8 && g.happy < 44,
    healthy: g.deathAge >= 92,
    learner: g.learn >= 80,
    yolo: real < 1.5e8 && spendRatio > .14,
    happy: g.happy >= 63,
    steady: true,
  };
  g.endId = END_ORDER.find(k => conds[k]);
  g.real = real;
  const dex = store.get("hp.dex", []); if (!dex.includes(g.endId)) { dex.push(g.endId); store.set("hp.dex", dex); g.newEnd = true; }
  const lives = store.get("hp.lives", []);
  lives.unshift({ n: g.name, tier: g.tier, end: g.endId, age: g.deathAge, real: Math.round(real), at: Date.now() });
  store.set("hp.lives", lives.slice(0, 30));
  try { localStorage.removeItem("hp.save"); } catch (e) {}
  render();
}

  if (g.intPaid > 0) L.push(`빌린 돈의 이자로 <b>${won(g.intPaid)}</b>을 냈어요. 이자는 받을 수도, 낼 수도 있어요.`);
  if (g.invPL) L.push(`투자로 <b>${won(g.invPL, true)}</b>이 ${g.invPL >= 0 ? "늘었어요" : "줄었어요"}. 투자는 늘 수도, 줄 수도 있어요.`);
  L.push(`평생 세금으로 <b>${won(g.tax)}</b>을 냈어요. 이 돈은 학교, 도로, 소방서에 쓰였어요.`);
  L.push(`라면 한 봉지가 1,000원에서 <b>${won(1000 * g.infl)}</b>이 되었어요. 물가가 ${(g.infl).toFixed(1)}배 오른 거예요.`);
  if (g.give > 0) L.push(`이웃과 <b>${won(g.give)}</b>을 나누었어요.`);
  if (g.scams) L.push(`사기를 <b>${g.scams}번</b> 당했어요. '원금 보장에 큰 수익'은 의심부터!`);
  return L;
}
function renderEnd() {
  const g = G, e = ENDS[g.endId];
  const gold = store.get("hp.gold", []);
  const stamps = g.stamps.map(k => `<span class="chip" style="color:var(${gold.includes(k) ? "--gold" : "--stamp"})">${CONCEPTS[k][0]}${gold.includes(k) ? " ★" : ""}</span>`).join("");
  app().innerHTML = `<section class="ending">
    <div class="sheet">
      <div class="endhead">
        <div><span class="eyebrow">${esc(g.name)}의 한평생 · ${BIRTH_YEAR}–${BIRTH_YEAR + g.deathAge} · ${TIERS[g.tier][0]}에서 출발</span>
          <h2 class="endtitle">${e[0]}</h2><p style="font-size:18px;margin-top:8px;max-width:36em">${e[1]}</p>
          <p class="small" style="margin-top:8px">${g.deathAge}세에 한평생 가계부의 마지막 장을 덮었어요.${g.newEnd ? " 엔딩 도감에 새 엔딩이 기록됐어요!" : ""}</p></div>
        <div class="bigstamp">${e[0]}</div>
      </div>
    </div>
    <div class="two">
      <div class="sheet plain copybox"><h3 style="font-size:20px;margin-bottom:6px">활동지에 옮겨 적어요</h3>
        <table>
          <tr><td>나의 엔딩</td><td>${e[0]}</td></tr>
          <tr><td>출발한 집</td><td>${TIERS[g.tier][0]}</td></tr>
          <tr><td>마지막 자산</td><td>${won(total(g))}</td></tr>
          <tr><td>라면으로 바꾸면</td><td>${ramenOf(total(g), g).toLocaleString("ko-KR")}개</td></tr>
          <tr><td>받은 이자 / 낸 이자</td><td>${won(g.intGot)} / ${won(g.intPaid)}</td></tr>
          <tr><td>라면 한 봉지 값</td><td>1,000원 → ${won(1000 * g.infl)}</td></tr>
          <tr><td>확인 문제</td><td>${g.quizRight} / ${g.quizTried} 정답</td></tr>
          <tr><td>마지막 행복 · 배움 · 신용</td><td>${Math.round(g.happy)} · ${Math.round(g.learn)} · ${Math.round(g.credit)}</td></tr>
        </table></div>
      <div class="sheet plain"><h3 style="font-size:20px;margin-bottom:8px">이번 삶에서 배운 것</h3><ul class="lessons">${lessonsOf(g).map(l => `<li>${l}</li>`).join("")}</ul></div>
    </div>
    <div class="two">
      <div class="sheet plain chart"><h3 style="font-size:20px;margin-bottom:6px">평생 자산 그래프</h3>${assetChart(g)}
        <div class="legend"><span><i style="background:var(--ink)"></i>통장에 찍힌 금액</span><span><i style="background:var(--minus)"></i>지금 돈 가치로 바꾼 금액</span></div>
        <p class="small" style="margin-top:6px">두 선이 점점 벌어지는 까닭은 물가가 올랐기 때문이에요. 숫자는 커져도 살 수 있는 물건은 그만큼 늘지 않아요.</p></div>
      <div class="sheet plain"><h3 style="font-size:20px;margin-bottom:8px">나의 갈림길과 포기한 것</h3><ul class="tl">${g.chosen.map(c => `<li><b>${c.a}세</b>${esc(c.t)} — ${esc(c.c)}${c.oc ? `<span class="small"> · 포기한 것: ${esc(c.oc)}</span>` : ""}</li>`).join("")}</ul></div>
    </div>
    <div class="sheet plain"><h3 style="font-size:20px;margin-bottom:8px">이번 삶에서 찍은 경제 개념 도장 ${g.stamps.length}개 <span class="small">(★ 금 도장)</span></h3><div class="chips">${stamps}</div></div>
    <div class="nextrow"><button class="btn" data-ov="dex">엔딩 도감 보기</button><button class="btn pri" id="btn-again">다시 태어나기</button></div>
  </section>`;
}
function axisWon(v) { const a = Math.abs(v), s = v < 0 ? "−" : ""; return a >= 1e8 ? s + (a / 1e8).toFixed(a >= 1e9 ? 0 : 1) + "억" : a >= 1e4 ? s + Math.round(a / 1e4).toLocaleString("ko-KR") + "만" : "0"; }
function assetChart(g) {
  const H = g.hist; if (H.length < 2) return "";
  const W = 640, Hh = 280, L = 56, R = 14, T = 14, B = 34;
  const vals = H.flatMap(h => [h.t, h.r]), mx = Math.max(1, ...vals), mn = Math.min(0, ...vals);
  const x = a => L + (a - H[0].a) / (H[H.length - 1].a - H[0].a) * (W - L - R);
  const y = v => T + (mx - v) / (mx - mn) * (Hh - T - B);
  let s = "";
  for (let i = 0; i <= 4; i++) { const v = mn + (mx - mn) * i / 4; s += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${axisWon(v)}</text>`; }
  for (let a = 10; a <= H[H.length - 1].a; a += 10) if (a >= H[0].a) s += `<text class="ax" x="${x(a)}" y="${Hh - 10}" text-anchor="middle">${a}세</text>`;
  const line = (k, c, w) => `<polyline points="${H.map(h => `${x(h.a).toFixed(1)},${y(h[k]).toFixed(1)}`).join(" ")}" style="fill:none;stroke:var(${c})" stroke-width="${w}" stroke-linejoin="round"/>`;
  if (mn < 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="나이별 자산 변화">${s}${line("t", "--ink", 2.5)}${line("r", "--minus", 2.5)}</svg>`;
}

/* 오버레이 */
function openOv(kind) {
  const ov = $("#ov"); let h = "";
  if (kind === "stamps") {
    const got = store.get("hp.stamps", []), gold = store.get("hp.gold", []);
    const keys = Object.keys(CONCEPTS).sort((a, b) => CONCEPTS[b][2] - CONCEPTS[a][2]);
    h = `<div class="ovh"><h2>개념 도장첩 · ${got.length}/${keys.length}</h2><button class="btn sm" data-close>닫기</button></div>
      <p class="small" style="margin-bottom:12px">빨간 도장은 그 개념을 만났다는 뜻, 금 도장은 확인 문제까지 맞혔다는 뜻이에요. '5학년 핵심' 도장부터 모아 보세요.</p>
      <div class="grid-st">${keys.map(k => { const v = CONCEPTS[k], on = got.includes(k), gd = gold.includes(k);
        return `<div class="st ${gd ? "on gold" : on ? "on" : "off"}">${v[2] ? `<span class="lv">5학년 핵심</span>` : ""}<div class="ns">${on ? v[0] : "?"}</div><b>${v[0]}${gd ? " ★" : ""}</b>${on ? v[1].split(". ")[0] + "." : "아직 찍지 못했어요"}</div>`; }).join("")}</div>`;
  } else if (kind === "dex") {
    const got = store.get("hp.dex", []);
    h = `<div class="ovh"><h2>엔딩 도감 · ${got.length}/${END_ORDER.length}</h2><button class="btn sm" data-close>닫기</button></div>
      <div class="grid-st">${END_ORDER.map(k => `<div class="st ${got.includes(k) ? "on" : "off"}"><div class="ns">${got.includes(k) ? "完" : "?"}</div><b>${got.includes(k) ? ENDS[k][0] : "???"}</b>${got.includes(k) ? ENDS[k][1].split(". ")[0] + "." : "아직 만나지 못한 엔딩"}</div>`).join("")}</div>`;
  } else {
    const lives = store.get("hp.lives", []);
    h = `<div class="ovh"><h2>지난 삶</h2><button class="btn sm" data-close>닫기</button></div>
      ${lives.length ? `<div class="lives">${lives.map(l => `<div><span>${esc(l.n)} · ${TIERS[l.tier][0]} · ${l.age}세</span><span>${ENDS[l.end][0]} · ${won(l.real)}</span></div>`).join("")}</div><p class="small" style="margin-top:8px">금액은 지금 돈 가치로 바꾼 마지막 자산이에요.</p>` : `<p class="small">아직 지나간 삶이 없어요.</p>`}`;
  }
  ov.innerHTML = `<div class="sheet plain ovc" role="dialog" aria-modal="true">${h}</div>`;
  ov.hidden = false;
}
function showTerm(t) {
  document.querySelectorAll(".gloss .on").forEach(x => x.classList.remove("on"));
  const row = [...document.querySelectorAll(".gloss [data-gl]")].find(x => x.dataset.gl === t);
  if (row) { row.classList.add("on"); row.scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" }); }
}

/* ===================== 이벤트 연결 ===================== */
document.addEventListener("click", e => {
  const term = e.target.closest(".term"); if (term) return showTerm(term.dataset.term);
  const b = e.target.closest("button");
  if (e.target.id === "ov" || (b && b.hasAttribute("data-close"))) { $("#ov").hidden = true; return; }
  if (!b) return;
  if (b.dataset.ov) return openOv(b.dataset.ov);
  if (b.id === "btn-rname") { $("#nm").value = pick(NAMES1) + pick(NAMES2); return; }
  if (b.id === "btn-born") {
    const nm = ($("#nm").value || "").trim() || pick(NAMES1) + pick(NAMES2);
    G = newGame(nm); view = "birth"; return render();
  }
  if (b.id === "btn-cont") { try { G = deser(store.get("hp.save")); view = "game"; } catch (err) { G = null; } return render(); }
  if (b.id === "btn-open") { view = "game"; G.curAge = 7; beginAt(G, "allow"); saveGame(); return render(); }
  if (b.id === "btn-home") { view = "start"; return render(); }
  if (b.id === "btn-again") { view = "start"; G = null; return render(); }
  if (b.dataset.c != null && G && G.phase === "event") return applyChoice(+b.dataset.c);
  if (b.dataset.q != null && G && G.phase === "result") return answerQuiz(+b.dataset.q);
  if (b.id === "btn-next" && G && G.phase === "result") return advance();
  if (b.dataset.j && G) {
    const k = b.dataset.j, d = +b.dataset.d;
    if (d > 0) shiftJar(G, k, 10);
    else { const to = k === "spend" ? "save" : "spend"; G.jars[k] -= 10; G.jars[to] += 10; }
    saveGame(); renderSide();
  }
});
document.addEventListener("change", e => { if (e.target.id === "growto" && G) { G.growTo = e.target.value; saveGame(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#ov").hidden = true; return; }
  if (e.key === "Enter" && e.target.classList && e.target.classList.contains("term")) return showTerm(e.target.dataset.term);
  if (!G || view !== "game" || e.target.closest("input,select")) return;
  if (G.phase === "event" && /^[1-9]$/.test(e.key)) { const btn = document.querySelector(`.choice[data-c="${+e.key - 1}"]`); if (btn && !btn.disabled) applyChoice(+e.key - 1); }
});

/* 자동 시험용 연결 고리 */
window.__hp = { EV, SCHED, QUIZ, CONCEPTS, GLOSS, get G() { return G; } };

render();
})();
</script>
