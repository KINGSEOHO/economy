<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>조개섬 시장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 교실 프로젝터용 — 왼쪽은 진행 순서 레일, 가운데는 큰 무대(이야기·타이머·우리 반 기록) */
:root {
  --bg: #E8F3F1;
  --surface: #FFFFFF;
  --surface-2: #D8EBE7;
  --ink: #0F2A3A;
  --muted: #4A6575;
  --line: #C3DAD6;
  --accent: #0A7C83;
  --accent-ink: #FFFFFF;
  --shell: #D98E12;
  --shell-soft: #FBEED3;
  --danger: #B93A26;
  --hl: #FFFFFF;

  --c-fish: #2B76C9;
  --c-fruit: #D4402F;
  --c-wood: #2C8F55;
  --c-salt: #7D8C9C;
  --c-cloth: #8B53C4;
  --c-pot: #CC7E14;

  /* 인쇄물은 화면 테마와 상관없이 종이 색으로 */
  --paper: #FFFFFF;
  --paper-ink: #1B2730;
  --paper-line: #B9C3C9;
  --p-fish: #2B76C9;
  --p-fruit: #D4402F;
  --p-wood: #2C8F55;
  --p-salt: #7D8C9C;
  --p-cloth: #8B53C4;
  --p-pot: #CC7E14;
  --p-shell: #D98E12;

  --f-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07161E; --surface: #0E2230; --surface-2: #143041; --ink: #E3F0F1; --muted: #8DA9B4;
    --line: #22404F; --accent: #37BEC3; --accent-ink: #032329; --shell: #F0B443; --shell-soft: #3A2C10;
    --danger: #F07A63;
    --c-fish: #5A9BE6; --c-fruit: #EF6A58; --c-wood: #4DB878; --c-salt: #9AA9B8; --c-cloth: #AD7FE0; --c-pot: #E59C3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07161E; --surface: #0E2230; --surface-2: #143041; --ink: #E3F0F1; --muted: #8DA9B4;
  --line: #22404F; --accent: #37BEC3; --accent-ink: #032329; --shell: #F0B443; --shell-soft: #3A2C10;
  --danger: #F07A63;
  --c-fish: #5A9BE6; --c-fruit: #EF6A58; --c-wood: #4DB878; --c-salt: #9AA9B8; --c-cloth: #AD7FE0; --c-pot: #E59C3A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.25; text-wrap: balance; margin: 0; }

.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- 상단 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.top-in { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 1.45rem; color: var(--ink); white-space: nowrap; }
.brand .ico { width: 34px; height: 34px; color: var(--shell); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 auto; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 999px;
  font-family: var(--f-ui); font-weight: 600; font-size: .95rem; color: var(--muted);
}
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.top-actions { display: flex; gap: 8px; }
.btn {
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 7px 12px; font-family: var(--f-ui); font-weight: 600; font-size: .9rem;
}
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--shell-soft); border-color: var(--shell); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.big { padding: 12px 20px; font-size: 1.05rem; border-radius: 12px; }

.banner { background: var(--shell-soft); border-bottom: 1px solid var(--line); }
.banner-in { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; padding-block: 8px; font-family: var(--f-ui); font-size: .92rem; }
.banner b { color: var(--shell); }

.view { padding-block: 20px 48px; }

/* ---------- 진행 ---------- */
#view-play { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - 100px); overflow: auto; }
.rail h2 { font-family: var(--f-ui); font-weight: 700; font-size: .78rem; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px 6px; }
.rail h2:first-child { margin-top: 0; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.step {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px;
  padding: 7px 10px; display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center;
  font-family: var(--f-ui); font-size: .9rem; color: var(--ink);
}
.step:hover { background: var(--surface-2); }
.step .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 700; background: var(--surface-2); color: var(--muted); }
.step .m { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.step.kind-round .n { background: var(--shell-soft); color: var(--shell); }
.step[aria-current="step"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--accent); }
.step[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); }

.stage { display: grid; gap: 20px; min-width: 0; }
.stage-head { display: grid; gap: 6px; }
.eyebrow { font-family: var(--f-ui); font-weight: 700; font-size: .85rem; letter-spacing: .06em; color: var(--accent); }
.stage-head h1 { font-size: clamp(2rem, 1.3rem + 2.4vw, 3.4rem); }
.stage-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage-grid.single { grid-template-columns: minmax(0, 1fr); }
.col { display: grid; gap: 16px; min-width: 0; }

.say { display: grid; gap: 12px; font-size: clamp(1.2rem, 1rem + .8vw, 1.75rem); line-height: 1.55; max-width: 34em; }
.say p { margin: 0; }
.say .quote { font-family: var(--f-display); color: var(--accent); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; min-width: 0; }
.panel h3 { font-size: 1.25rem; margin-bottom: 10px; }
.panel .sub { font-family: var(--f-ui); font-size: .85rem; color: var(--muted); margin: -6px 0 12px; }

.rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: clamp(1.05rem, .95rem + .4vw, 1.35rem); }
.rules li { display: grid; grid-template-columns: 30px 1fr; gap: 8px; align-items: start; }
.rules li::before { content: ""; width: 22px; height: 22px; margin-top: .25em; border-radius: 50% 50% 50% 8px; background: var(--shell); }
.qs { margin: 0; padding-left: 1.4em; display: grid; gap: 10px; font-size: clamp(1.1rem, 1rem + .5vw, 1.45rem); }
.qs li::marker { font-family: var(--f-display); color: var(--accent); }

.concepts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.concept { border-radius: 12px; padding: 14px 16px; background: var(--surface-2); }
.concept b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; color: var(--accent); margin-bottom: 4px; }
.concept span { font-size: 1.02rem; }
.concept small { display: block; margin-top: 4px; font-family: var(--f-ui); color: var(--muted); }

.note { border: 2px dashed var(--shell); background: var(--shell-soft); border-radius: var(--r); padding: 14px 18px; font-family: var(--f-ui); font-size: .95rem; }
.note h3 { font-family: var(--f-ui); font-weight: 700; font-size: .85rem; letter-spacing: .06em; color: var(--shell); margin-bottom: 6px; }
.note ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }

.stage-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }
.kbd-hint { font-family: var(--f-ui); font-size: .8rem; color: var(--muted); align-self: center; }

/* 타이머 */
.timer { display: grid; gap: 10px; justify-items: center; text-align: center; }
.timer .digits { font-family: var(--f-display); font-size: clamp(3.4rem, 2rem + 5vw, 6.5rem); line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer.small .digits { font-size: clamp(2.2rem, 1.6rem + 2vw, 3.2rem); }
.timer .bar { width: 100%; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.timer .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; transition: transform .4s linear; }
.timer.low .digits { color: var(--danger); }
.timer.low .bar i { background: var(--danger); }
.timer.done .digits { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.timer .ctl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* 마을 */
.towns { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.town { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.town .ico { width: 44px; height: 44px; }
.town b { font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; display: block; }
.town small { font-family: var(--f-ui); font-size: .78rem; color: var(--muted); }

.ico { display: block; fill: currentColor; }
.ico .hl { fill: var(--hl); }
.ico .hl-s { fill: none; stroke: var(--hl); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ico .st { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }

/* 기록 타일 */
.tally { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { border-radius: 12px; background: var(--surface-2); padding: 10px; display: grid; gap: 6px; justify-items: center; text-align: center; }
.tile .ico { width: 36px; height: 36px; }
.tile .nm { font-family: var(--f-ui); font-size: .82rem; font-weight: 600; }
.tile .cnt { font-family: var(--f-display); font-size: 2.3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile .pm { display: flex; gap: 6px; }
.pmb { width: 38px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-ui); font-weight: 700; font-size: 1.1rem; line-height: 1; }
.pmb.plus { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tally-total { font-family: var(--f-ui); font-size: .9rem; color: var(--muted); margin-top: 10px; text-align: right; }
.tally-total b { font-family: var(--f-display); font-weight: 400; font-size: 1.4rem; color: var(--ink); }

.prices { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; }
.prow .ico { width: 30px; height: 30px; }
.prow .nm { font-family: var(--f-ui); font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper input { width: 64px; height: 36px; text-align: center; border-radius: 9px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stepper .unit { font-family: var(--f-ui); font-size: .85rem; color: var(--muted); width: 2.2em; }

/* 사건 카드 */
.events { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ecard { perspective: 900px; border: 0; padding: 0; background: none; aspect-ratio: 3 / 4; max-width: 100%; }
.ecard .in { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.3,1.4,.5,1); transform-style: preserve-3d; }
.ecard .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; display: grid; place-items: center; padding: 10px; text-align: center; }
.ecard .back { background: var(--ink); color: var(--surface); font-family: var(--f-display); font-size: clamp(1.2rem, 1rem + 1vw, 2rem); }
.ecard .back .ico { width: 40%; height: auto; color: var(--shell); margin: 0 auto 6px; }
.ecard .front { transform: rotateY(180deg); background: var(--surface); border: 3px solid var(--shell); }
.ecard.flipped .in { transform: rotateY(180deg); }
.ecard:disabled { cursor: default; }
.ecard.dim { opacity: .35; }
.event-big { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; padding: 20px; border-radius: var(--r); border: 3px solid var(--shell); background: var(--surface); animation: pop .6s cubic-bezier(.3,1.5,.5,1); }
.event-big .ico { width: 96px; height: 96px; }
.event-big h3 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.4rem); margin-bottom: 4px; }
.event-big p { margin: 0; font-size: clamp(1.1rem, 1rem + .5vw, 1.45rem); }
@keyframes pop { from { transform: scale(.85); opacity: .2; } to { transform: none; opacity: 1; } }

/* 욕구 순환도 */
.cycle-wrap { display: grid; gap: 12px; justify-items: center; }
.cycle-wrap > svg { width: 100%; max-width: 420px; height: auto; }
.cycle-wrap .legend { font-family: var(--f-ui); font-size: .88rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.legend i { display: inline-block; width: 26px; height: 0; border-top: 3px solid var(--ink); vertical-align: middle; margin-right: 6px; }
.legend i.dash { border-top-style: dashed; }

/* 조개 선물 */
.gift { display: grid; justify-items: center; gap: 10px; text-align: center; }
.gift .num { font-family: var(--f-display); font-size: clamp(4rem, 2rem + 7vw, 8rem); line-height: 1; color: var(--shell); font-variant-numeric: tabular-nums; }
.gift .pile { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; max-width: 420px; min-height: 30px; }
.gift .pile .ico { width: 22px; height: 22px; color: var(--shell); animation: drop .5s ease-out both; }
@keyframes drop { from { transform: translateY(-18px); opacity: 0; } to { transform: none; opacity: 1; } }

.starters { display: grid; gap: 10px; }
.starter { font-family: var(--f-display); font-size: clamp(1.3rem, 1.1rem + .8vw, 1.9rem); padding: 12px 16px; border-radius: 12px; background: var(--surface-2); }
.starter span { color: var(--muted); letter-spacing: .1em; }

/* ---------- 차트 ---------- */
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { font-family: var(--f-ui); font-size: 15px; fill: var(--muted); }
.chart .lbl { font-family: var(--f-display); font-size: 17px; fill: var(--ink); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--muted); stroke-width: 1.5; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-ui); font-size: .85rem; margin-top: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.chart-legend i.avg { height: 4px; width: 18px; background: var(--ink); border-radius: 2px; }
.empty { font-family: var(--f-ui); color: var(--muted); padding: 24px; text-align: center; border: 1.5px dashed var(--line); border-radius: 12px; }

.insights { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.insight { border-radius: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); }
.insight .big { font-family: var(--f-display); font-size: 2.4rem; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
.insight p { margin: 4px 0 0; font-size: 1.02rem; }
.insight small { font-family: var(--f-ui); color: var(--muted); }

.results { display: grid; gap: 20px; }
.results-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }

/* ---------- 기록판 ---------- */
.board { display: grid; gap: 20px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.tbl-wrap { overflow-x: auto; }
table.rec { border-collapse: collapse; width: 100%; font-family: var(--f-ui); font-size: .95rem; }
table.rec th, table.rec td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
table.rec th { font-weight: 600; color: var(--muted); font-size: .82rem; }
table.rec td:first-child, table.rec th:first-child { text-align: left; }
table.rec .who { display: flex; gap: 8px; align-items: center; font-weight: 600; }
table.rec .who .ico { width: 24px; height: 24px; }
table.rec input { width: 58px; height: 34px; text-align: center; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
table.rec tfoot td { font-weight: 700; border-bottom: 0; }
.board-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

/* ---------- 수업 안내 ---------- */
.guide { display: grid; gap: 28px; max-width: 1100px; }
.guide-hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.guide-hero h1 { font-size: clamp(2.2rem, 1.4rem + 2.6vw, 3.6rem); }
.guide-hero .lead { font-size: 1.2rem; margin: 10px 0 0; max-width: 32em; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fact { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.fact small { display: block; font-family: var(--f-ui); font-size: .78rem; letter-spacing: .06em; color: var(--muted); }
.fact b { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; }
.guide section { display: grid; gap: 12px; }
.guide h2 { font-size: 1.8rem; }
.guide p { margin: 0; max-width: 46em; }
.guide .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.guide ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.goals { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.goal { padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 6px; align-content: start; }
.goal .tag { font-family: var(--f-ui); font-size: .78rem; font-weight: 700; color: var(--shell); letter-spacing: .06em; }
.goal b { font-family: var(--f-display); font-weight: 400; font-size: 1.25rem; }
table.flow { border-collapse: collapse; width: 100%; font-size: .95rem; }
table.flow th, table.flow td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.flow th { font-family: var(--f-ui); font-size: .8rem; color: var(--muted); font-weight: 600; }
table.flow td.t { font-family: var(--f-ui); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
table.flow td.s { font-family: var(--f-display); white-space: nowrap; }
table.flow tr.sess td { background: var(--surface-2); font-family: var(--f-ui); font-weight: 700; font-size: .85rem; }

/* ---------- 인쇄 자료 ---------- */
.print-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-family: var(--f-ui); font-weight: 600; font-size: .9rem; color: var(--muted); }

/* ---------------- 타이머 ---------------- */
const timer = { total: 0, remain: 0, running: false, last: 0, id: null, done: false };
let audioCtx = null;
function setTimer(min) { stopTimer(); timer.total = timer.remain = min * 60; timer.done = false; paintTimer(); }
function startTimer() {
  if (timer.remain <= 0) return;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch (e) {}
  timer.running = true; timer.last = performance.now();
  timer.id = setInterval(tick, 250); paintTimer();
}
function stopTimer() { timer.running = false; clearInterval(timer.id); timer.id = null; paintTimer(); }
function tick() {
  const now = performance.now();
  timer.remain = Math.max(0, timer.remain - (now - timer.last) / 1000); timer.last = now;
  if (timer.remain <= 0) { stopTimer(); timer.done = true; chime(); }
  paintTimer();
}
function chime() {
  if (!audioCtx) return;
  try {
    [0, .35, .7].forEach((t, k) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = [660, 880, 1100][k]; o.type = "triangle";
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.25, audioCtx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .3);
      o.connect(g).connect(audioCtx.destination); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .32);
    });
  } catch (e) {}
}
function paintTimer() {
  const el = $("#timer"); if (!el) return;
  const r = Math.ceil(timer.remain), m = Math.floor(r / 60), s = r % 60;
  el.querySelector(".digits").textContent = `${m}:${String(s).padStart(2, "0")}`;
  el.querySelector(".bar i").style.transform = `scaleX(${timer.total ? timer.remain / timer.total : 0})`;
  el.classList.toggle("low", timer.remain > 0 && timer.remain <= 60);
  el.classList.toggle("done", timer.done);
  const b = el.querySelector("[data-t=toggle]");
  b.textContent = timer.running ? "잠깐 멈춤" : (timer.remain < timer.total && timer.remain > 0 ? "이어서 시작" : "시작");
}

function renderRail() {
  const groups = [1, 2].map(s => {
    const items = STAGES.map((st, i) => ({ st, i })).filter(x => x.st.s === s).map(({ st, i }) =>
      `<li><button class="step kind-${st.kind}" data-go="${i}" ${i === state.stage ? 'aria-current="step"' : ""}>
        <span class="n">${STAGES.slice(0, i + 1).filter(x => x.s === s).length}</span><span>${st.title}</span><span class="m">${st.min}분</span></button></li>`).join("");
    return `<div class="sess-group"><h2>${s}차시 · ${s === 1 ? "물물교환에서 조개 돈으로" : "가격은 어떻게 정해질까"}</h2><ol>${items}</ol></div>`;
  }).join("");
  const strip = `<div class="strip">${STAGES.map((st, i) =>
    `<button class="chip-step" data-go="${i}" ${i === state.stage ? 'aria-current="step"' : ""}>${st.s}-${STAGES.slice(0, i + 1).filter(x => x.s === st.s).length} ${st.title.split(" · ")[0]}</button>`).join("")}</div>`;
  $("#rail").innerHTML = groups + strip;
  const cur = $("#rail .strip [aria-current]"); if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
}

  const isRound = st.kind === "round";

  }
  if (st.extra && st.extra.includes("chartPrices") && !st.extra.includes("inflation")) right.push(insightsHTML(["event"]));

  const single = !right.length;

      <h1>${st.title}</h1>

      <span class="kbd-hint">키보드 ← → 로도 넘길 수 있어요</span>

function cycleSVG() {
  const cx = 210, cy = 200, R = 140, nr = 34;
  const pos = GOODS.map((g, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
  let lines = "";
  GOODS.forEach((g, i) => {
    wants(i).forEach((j, k) => {
      const [x1, y1] = pos[i], [x2, y2] = pos[j];
      const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
      const sx = x1 + dx / L * (nr + 4), sy = y1 + dy / L * (nr + 4), ex = x2 - dx / L * (nr + 10), ey = y2 - dy / L * (nr + 10);
      lines += `<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" style="stroke:${gColor(i)}" stroke-width="3" ${k ? 'stroke-dasharray="7 6"' : ""} marker-end="url(#ah${i})"/>`;
    });
  });
  const marks = GOODS.map((g, i) => `<marker id="ah${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${gColor(i)}"/></marker>`).join("");
  const nodes = GOODS.map((g, i) => { const [x, y] = pos[i];
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="${nr}" style="fill:var(--surface);stroke:${gColor(i)}" stroke-width="3"/>
      <g transform="translate(-17 -24)" style="color:${gColor(i)}"><svg class="ico" width="34" height="34" viewBox="0 0 48 48">${ICONS[g.id]}</svg></g>
      <text y="22" text-anchor="middle" font-size="14" style="font-family:var(--f-display);fill:var(--ink)">${g.name}</text></g>`; }).join("");
  return `<svg viewBox="0 0 420 400" role="img" aria-label="마을마다 원하는 물건의 방향. 물고기는 과일과 나무를, 과일은 나무와 소금을 원하는 식으로 한 방향으로만 돌아요."><defs>${marks}</defs>${lines}${nodes}</svg>`;
}

/* ---------------- 차트 ---------------- */
function missionsChart() {
  const W = 640, H = 300, L = 40, Rm = 14, T = 26, B = 46;
  const totals = ROUNDS.map(r => sum(state.missions[r.key]));
  if (!sum(totals)) return `<div class="empty">미션 성공을 기록하면 여기에 막대그래프가 그려져요.</div>`;
  const max = Math.max(4, Math.ceil(Math.max(...totals) / 4) * 4);
  const y = v => T + (H - T - B) * (1 - v / max);
  const bw = (W - L - Rm) / ROUNDS.length;
  let g = "";
  for (let v = 0; v <= max; v += max / 4) g += `<line class="grid" x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  ROUNDS.forEach((r, k) => {
    const x = L + k * bw + bw * .2, w = bw * .6; let acc = 0;
    state.missions[r.key].forEach((v, i) => { if (!v) return;
      g += `<rect x="${x}" y="${y(acc + v)}" width="${w}" height="${y(acc) - y(acc + v)}" style="fill:${gColor(i)};stroke:var(--surface)" stroke-width="1.5"/>`; acc += v; });
    g += `<text class="lbl" x="${x + w / 2}" y="${y(acc) - 8}" text-anchor="middle">${acc}</text>`;
    g += `<text class="ax" x="${x + w / 2}" y="${H - B + 20}" text-anchor="middle">${r.short} ${r.label}</text>`;
  });
  g += `<line class="base" x1="${L}" x2="${W - Rm}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="라운드별 미션 성공 수: ${ROUNDS.map((r, k) => `${r.label} ${totals[k]}번`).join(", ")}">${g}</svg>${legend(false)}`;
}
function pricesChart() {
  const rounds = PRICE_ROUNDS.filter(rk => state.prices[rk].some(v => v != null));
  if (!rounds.length) return `<div class="empty">2라운드부터 마지막 판매 가격을 기록하면 여기에 꺾은선그래프가 그려져요.</div>`;
  const W = 640, H = 320, L = 40, Rm = 60, T = 20, B = 46;
  const all = rounds.flatMap(rk => state.prices[rk].filter(v => v != null));
  const max = Math.max(4, Math.ceil(Math.max(...all) / 4) * 4);
  const y = v => T + (H - T - B) * (1 - v / max);
  const xs = PRICE_ROUNDS.map((_, k) => L + 30 + k * ((W - L - Rm - 60) / 2));
  const lbl = { r2: "2R 조개 돈", r3: "3R 사건", r4: "4R 조개 넘침" };
  let g = "";
  for (let v = 0; v <= max; v += max / 4) g += `<line class="grid" x1="${L}" x2="${W - Rm + 20}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  PRICE_ROUNDS.forEach((rk, k) => { g += `<text class="ax" x="${xs[k]}" y="${H - B + 22}" text-anchor="middle" ${rounds.includes(rk) ? "" : 'opacity=".45"'}>${lbl[rk]}</text>`; });
  GOODS.forEach((gd, i) => {
    const pts = PRICE_ROUNDS.map((rk, k) => [xs[k], state.prices[rk][i]]).filter(p => p[1] != null);
    if (!pts.length) return;
    g += `<polyline points="${pts.map(p => `${p[0]},${y(p[1])}`).join(" ")}" style="fill:none;stroke:${gColor(i)}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
    pts.forEach(p => { g += `<circle cx="${p[0]}" cy="${y(p[1])}" r="4.5" style="fill:${gColor(i)};stroke:var(--surface)" stroke-width="1.5"/>`; });
  });
  const avgPts = PRICE_ROUNDS.map((rk, k) => { const v = state.prices[rk].filter(x => x != null); return v.length ? [xs[k], sum(v) / v.length] : null; }).filter(Boolean);
  if (avgPts.length) {
    g += `<polyline points="${avgPts.map(p => `${p[0]},${y(p[1])}`).join(" ")}" style="fill:none;stroke:var(--ink)" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>`;
    avgPts.forEach(p => { g += `<circle cx="${p[0]}" cy="${y(p[1])}" r="6" style="fill:var(--ink)"/>`; });
    const lp = avgPts[avgPts.length - 1];
    g += `<text class="lbl" x="${lp[0] + 12}" y="${y(lp[1]) + 6}">평균 ${fmt(lp[1])}</text>`;
  }
  g += `<line class="base" x1="${L}" x2="${W - Rm + 20}" y1="${y(0)}" y2="${y(0)}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="물건별 판매 가격 변화">${g}</svg>${legend(true)}`;
}
function legend(avg) {
  return `<div class="chart-legend">${GOODS.map((g, i) => `<span><i style="background:${gColor(i)}"></i>${g.name}</span>`).join("")}${avg ? `<span><i class="avg"></i>평균 가격</span>` : ""}</div>`;
}
function insightsHTML(which) {
  const out = [];
  const t = k => sum(state.missions[k]);
  const avg = rk => { const v = state.prices[rk].filter(x => x != null); return v.length ? sum(v) / v.length : null; };
  if (which.includes("barter")) {
    const a = t("r1"), b = t("r2");
    if (a || b) {
      out.push(a ? `<div class="insight"><div class="big">${fmt(b / a)}배</div><p>조개 돈을 쓰자 미션을 ${a}번에서 ${b}번으로 더 많이 해결했어요.</p><small>1라운드 → 2라운드</small></div>`
                 : `<div class="insight"><div class="big">0 → ${b}</div><p>물물교환으로는 한 번도 못 했던 미션을 조개 돈으로 ${b}번 해결했어요.</p><small>1라운드 → 2라운드</small></div>`);
    }
  }
  if (which.includes("event")) {
    const ev = EVENTS.find(e => e.id === state.event);
    if (ev) {
      const p2 = state.prices.r2[ev.good], p3 = state.prices.r3[ev.good];
      if (p2 != null && p3 != null) {
        const d = p3 - p2;
        out.push(`<div class="insight"><div class="big">${p2} → ${p3}</div><p>'${ev.title.replace(/!$/, "")}' 뒤에 ${GOODS[ev.good].name} 값이 ${d > 0 ? `조개 ${d}개 올랐어요` : d < 0 ? `조개 ${-d}개 내렸어요` : "그대로였어요"}.</p><small>${ev.hint}</small></div>`);
      } else out.push(`<div class="insight"><p>'${ev.title.replace(/!$/, "")}' 사건이 일어났어요. 2·3라운드 ${GOODS[ev.good].name} 가격을 기록하면 변화를 비교해 줄게요.</p></div>`);
    }
  }
  if (which.includes("inflation")) {
    const a = avg("r2"), b = avg("r4");
    if (a && b) out.push(`<div class="insight"><div class="big">${fmt(b / a)}배</div><p>조개를 3배로 늘렸더니 물건 값이 평균 ${fmt(a)}개에서 ${fmt(b)}개로 올랐어요.</p><small>2라운드 → 4라운드 평균 가격</small></div>`);
  }
  if (which.includes("missions4")) {
    const a = t("r2"), b = t("r4");
    if (a || b) out.push(`<div class="insight"><div class="big">${a} → ${b}</div><p>조개는 30개에서 90개가 됐지만 해결한 미션은 ${Math.abs(b - a) <= 2 ? "거의 그대로예요" : b > a ? "조금 늘었어요" : "오히려 줄었어요"}.</p><small>2라운드 → 4라운드 미션 성공 수</small></div>`);
  }
  return out.length ? `<div class="insights">${out.join("")}</div>` : "";
}

        <li><b>미션 카드</b> 마을별 A·B 2장씩 총 24장 (2쪽)</li>
        <li><b>조개 돈</b> 마을당 최대 90개. 인쇄도 되지만 바둑알·클립·단추를 쓰면 훨씬 빨라요</li>
        <li><b>가격표·역할 카드</b> 1쪽, <b>경제 일기</b> 학생 수만큼</li>
        <li>프로젝터와 이 화면 (타이머·기록·그래프)</li></ul></div>
      <div style="display:grid;gap:12px"><h2>운영 팁</h2><ul class="plain">
        <li>미션 확인은 이장만 촌장님께 와요. 줄이 길어지면 학생 '부촌장'을 한 명 두세요.</li>
        <li>기록 도우미 학생이 노트북에서 +1을 누르게 하면 선생님은 교실을 돌아볼 수 있어요.</li>
        <li>타이머가 끝나면 소리가 나요(처음 '시작'을 누른 뒤부터). \"조개섬에 밤이 왔어요\"를 멈춤 신호로 약속해 두세요.</li>
        <li>'교사 메모'는 학생에게 보여 주기 전에 꺼 두세요. 사건 직접 고르기와 예상 변화가 들어 있어요.</li>
        <li>기록은 이 브라우저에만 저장돼요. 1차시와 2차시를 같은 컴퓨터로 진행하세요.</li></ul></div>
    </section>

    <section class="two">
      <div style="display:grid;gap:12px"><h2>평가</h2><ul class="plain">
        <li><b>관찰</b> 규칙을 지키며 거래하는가 / 모둠 역할을 해내는가 / 가격을 상황에 맞게 바꾸는가</li>
        <li><b>발표</b> 물물교환이 어려웠던 까닭, 값이 변한 까닭을 자기 경험으로 말하는가</li>
        <li><b>경제 일기</b> 화폐의 기능, 가격 변화, 인플레이션 중 하나 이상을 자기 말로 쓰는가</li></ul></div>
      <div style="display:grid;gap:12px"><h2>학년에 맞게 바꾸기</h2><ul class="plain">
        <li><b>3~4학년</b> 1차시 중심으로 운영하고, 2차시는 3라운드(사건)까지만 해도 충분해요.</li>
        <li><b>5~6학년</b> 4라운드 뒤 \"섬 대장은 조개를 어떻게 관리해야 할까?\" 토의로 중앙은행 역할까지 넓혀 보세요.</li>
        <li><b>에듀테크</b> 모둠 태블릿으로 가격 기록 사진을 찍어 패들렛에 올리면 모둠별 가격 일지가 돼요.</li></ul></div>
    </section>

    <section><h2>교육과정 연계</h2>
      <p>초등 사회과 경제 영역(희소성과 선택, 생산·소비·교환, 시장과 가격)과 연결돼요. 학년과 교과서에 맞는 성취기준 코드를 지도안에 적어 넣어 주세요. 창의적 체험활동의 금융·경제교육 시간으로도 운영할 수 있어요.</p></section>
  </div>`;
}

/* ---------------- 인쇄 자료 ---------------- */
const PRINT_SETS = [
  ["goods", "물건 카드 · 6쪽"], ["missions", "미션 카드 · 2쪽"], ["coins", "조개 돈 · 2쪽"],
  ["misc", "가격표·역할 · 1쪽"], ["diary", "경제 일기 · 1쪽"],
];
function sheet(title, sub, body) {
  return `<div class="sheet"><div class="sh"><b>${title}</b><span>${sub}</span></div>${body}</div>`;
}
function sheetsHTML(set) {
  if (set === "goods") return GOODS.map((g, i) => sheet(`물건 카드 · ${g.town}`, "16장 · 점선을 따라 잘라요",
    `<div class="grid-cards">${Array.from({ length: 16 }, () => `<div class="gcard" style="--k:${pColor(i)}"><div class="fr"><span class="tn">${g.town}</span>${icon(g.id)}<span class="nm">${g.name}</span></div></div>`).join("")}</div>`)).join("");
  if (set === "missions") {
    const cards = GOODS.flatMap((g, i) => [0, 1, 0, 1].map(v => {
      const [t, need] = MISSIONS[i][v], w = wants(i);
      return `<div class="mcard" style="--k:${pColor(i)}"><div class="fr">
        <div class="mtop"><span class="chip">${g.town}</span><span>생존 미션 ${v ? "B" : "A"}</span></div>
        <h4>${t}</h4>
        <div class="need">${w.map((j, k) => `<div><span style="color:${pColor(j)}">${icon(GOODS[j].id)}</span>${GOODS[j].name} × ${need[k]}<em>${GOODS[j].town}</em></div>`).join("")}</div>
        <div class="ok"><span>모두 모으면 촌장님께!</span><i></i></div></div></div>`;
    }));
    return [0, 1].map(p => sheet("생존 미션 카드", `${p + 1}/2 · 마을마다 A·B 2장씩`, `<div class="grid-missions">${cards.slice(p * 12, p * 12 + 12).join("")}</div>`)).join("");
  }
  if (set === "coins") return [1, 5].map(v => sheet(`조개 돈 · ${v}조개`, "35개 · 바둑알이나 클립으로 대신해도 좋아요",
    `<div class="grid-coins">${Array.from({ length: 35 }, () => `<div class="coin ${v === 5 ? "five" : ""}"><div class="c">${icon("shell")}<b>${v}조개</b></div></div>`).join("")}</div>`)).join("");
  if (set === "misc") return sheet("가격표 · 역할 카드", "가격표는 마을 책상 앞에 세워 두어요",
    `<div class="sheet-misc"><div class="tags">${GOODS.map((g, i) => `<div class="ptag" style="--k:${pColor(i)}"><div class="fr">${icon(g.id)}<h4>${g.town} 가게</h4>
      <div class="eq">${g.name} 1개 = <u></u> 조개</div><div class="rounds"><span>2라운드 ____</span><span>3라운드 ____</span><span>4라운드 ____</span></div></div></div>`).join("")}</div>
     <div class="roles">${ROLES.map(r => `<div class="role"><div class="fr"><h4>${r[0]}</h4><p>${r[1]}</p><small>${r[2]}</small></div></div>`).join("")}</div></div>`);
  if (set === "diary") return sheet("조개섬 경제 일기", "2차시 끝에 써요",
    `<div class="ws"><h3>조개섬 경제 일기</h3>
      <div class="name"><span>( )학년 ( )반 ( )번</span><span>이름 <u></u></span><span>우리 마을 <u></u></span></div>
      <div class="q"><b>1. 물물교환을 할 때 가장 힘들었던 점은 무엇인가요?</b><div class="lines"></div></div>
      <div class="q"><b>2. 조개 돈이 생기고 무엇이 달라졌나요?</b><div class="lines"></div></div>
      <div class="q"><b>3. 사건이 일어난 뒤 값이 변한 물건과 그 까닭을 써 보세요.</b><div class="lines"></div></div>
      <div class="q"><b>4. 우리 마을 물건 값의 변화를 꺾은선그래프로 그려 보세요.</b><div class="graph"><span style="left:12%">2라운드</span><span style="left:45%">3라운드</span><span style="left:78%">4라운드</span></div></div>
      <div class="q" style="margin-top:4mm"><b>5. 조개가 많아졌는데 왜 물건 값이 올랐을까요?</b><div class="lines"></div></div>
      <div class="q"><b>6. 오늘의 경제 한 줄</b><div class="lines" style="height:8mm"></div></div>
      <table><tr><td>규칙을 지키며 공정하게 거래했어요.</td><td>☆☆☆</td></tr><tr><td>모둠 친구들과 역할을 나누어 협력했어요.</td><td>☆☆☆</td></tr><tr><td>물건 값이 변하는 까닭을 설명할 수 있어요.</td><td>☆☆☆</td></tr></table></div>`);
  return "";
}
function renderPrint() {
  const set = state.printSet;
  $("#view-print").innerHTML = `
    <div class="print-controls">
      <div class="seg" role="group" aria-label="인쇄할 자료">${PRINT_SETS.map(([k, l]) => `<button data-ps="${k}" aria-pressed="${k === set}">${l}</button>`).join("")}</div>
      ${inFrame ? "" : `<button class="btn primary" id="btn-print">이 자료 인쇄하기</button>`}
    </div>
    <p class="print-note">${inFrame
      ? "이 화면에서는 인쇄 창을 열 수 없어요. 저장소의 <b>index.html</b> 파일을 내려받아 크롬이나 엣지로 연 뒤, 이 탭에서 '이 자료 인쇄하기'를 누르면 A4로 인쇄돼요. 인쇄 설정에서 여백 없음, 배경 그래픽 켜기를 선택하세요."
      : "A4 세로로 인쇄돼요. 인쇄 설정에서 여백은 '없음', '배경 그래픽'은 켜 주세요. 물건 카드는 두꺼운 종이에 뽑으면 여러 해 쓸 수 있어요."}</p>
    <div class="sheets-scroll"><div class="sheets">${sheetsHTML(set)}</div></div>`;
}

/* ---------------- 화면 전환 ---------------- */
function brand() { $("#brand").innerHTML = `${icon("shell")}<span>조개섬 시장</span>`; }
function showView(v) {
  state.view = v; save();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === v));
  ["play", "board", "chart", "guide", "print"].forEach(k => { $("#view-" + k).hidden = k !== v; });
  if (v === "play") { renderRail(); renderStage(); }
  if (v === "board") renderBoard();
  if (v === "chart") renderChart();
  if (v === "guide") renderGuide();
  if (v === "print") renderPrint();
  $("#banner").hidden = !state.example;
}
function goStage(i) {
  if (i < 0 || i >= STAGES.length) return;
  state.stage = i; save(); renderRail(); renderStage();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function refreshLiveCharts() {
  // 진행 화면에서 숫자를 바꾸면 같은 화면의 그래프·인사이트도 바로 다시 그린다
  if (state.view !== "play") return;
  const st = STAGES[state.stage];
  if (st.extra.some(x => ["chartMissions", "chartPrices", "inflation"].includes(x))) renderStageKeepTimer();
}
function renderStageKeepTimer() {
  const saved = { ...timer }; renderStage();
  Object.assign(timer, saved); if (saved.running) { timer.running = false; startTimer(); } paintTimer();
}

/* ---------------- 이벤트 ---------------- */
function bind() {
  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.classList.contains("tab")) return showView(b.dataset.view);
    if (b.dataset.go != null) return goStage(+b.dataset.go);
    if (b.dataset.step) return goStage(state.stage + +b.dataset.step);
    if (b.dataset.t === "toggle") return timer.running ? stopTimer() : (timer.done ? (setTimer(STAGES[state.stage].min), startTimer()) : startTimer());
    if (b.dataset.t === "plus") { timer.remain += 60; timer.total = Math.max(timer.total, timer.remain); timer.done = false; return paintTimer(); }
    if (b.dataset.t === "reset") return setTimer(STAGES[state.stage].min);
    if (b.dataset.m) {
      const [rk, i, d] = b.dataset.m.split(","); const arr = state.missions[rk];
      arr[+i] = Math.max(0, arr[+i] + +d); markReal(); save();
      $(`#cnt-${rk}-${i}`).textContent = arr[+i]; $(`#tot-${rk}`).textContent = sum(arr);
      return;
    }
    if (b.dataset.p) {
      const [rk, i, d] = b.dataset.p.split(","); const cur = state.prices[rk][+i];
      state.prices[rk][+i] = Math.max(0, Math.min(999, (cur ?? (state.prices.r2[+i] ?? 3)) + (cur == null ? 0 : +d)));
      markReal(); save(); $(`#price-${rk}-${i}`).value = state.prices[rk][+i]; return;
    }
    if (b.dataset.evPick != null) {
      const pool = EVENTS.map(x => x.id);
      const id = pool[Math.floor(Math.random() * pool.length)], ev = EVENTS.find(x => x.id === id);
      const front = b.querySelector(".front");
      front.innerHTML = `<span><span style="color:${gColor(ev.good)};display:block;width:50%;margin:0 auto">${icon(ev.icon)}</span><b style="font-family:var(--f-display);font-weight:400;font-size:1.3rem">${ev.title}</b></span>`;
      b.classList.add("flipped");
      document.querySelectorAll(".ecard").forEach(c => { c.disabled = true; if (c !== b) c.classList.add("dim"); });
      state.event = id; markReal(); save();
      setTimeout(() => renderStageKeepTimer(), 1500);
      return;
    }
    if (b.dataset.ev != null) { state.event = b.dataset.ev || null; markReal(); save(); return renderStageKeepTimer(); }
    if (b.id === "btn-cycle") { $("#cycle-slot").innerHTML = `<div class="cycle-wrap">${cycleSVG()}<div class="legend"><span><i></i>가장 원해요</span><span><i class="dash"></i>조금 원해요</span></div></div>`; return; }
    if (b.id === "btn-gift") return giftAnim(b);
    if (b.dataset.ps) { state.printSet = b.dataset.ps; save(); return renderPrint(); }
    if (b.id === "btn-print") { try { window.print(); } catch (err) {} return; }
    if (b.id === "btn-notes") { state.notes = !state.notes; save(); b.setAttribute("aria-pressed", state.notes); const n = $("#note"); if (n) n.hidden = !state.notes; return; }
    if (b.id === "btn-full") {
      try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); } catch (err) {}
      return;
    }
    if (b.id === "btn-start-class") { const keep = { stage: 0, notes: state.notes, printSet: state.printSet }; state = Object.assign(blank(), keep); save(); return showView("play"); }
    if (b.id === "btn-reset") {
      if (b.dataset.armed) { const keep = { stage: state.stage, notes: state.notes, printSet: state.printSet, view: "board" }; state = Object.assign(blank(), keep); save(); return showView("board"); }
      b.dataset.armed = "1"; b.textContent = "한 번 더 누르면 모두 지워져요"; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = "기록 모두 지우기"; } }, 4000); return;
    }
    if (b.id === "btn-example") { const keep = { stage: state.stage, notes: state.notes, printSet: state.printSet, view: "board" }; state = Object.assign(withExample(), keep); save(); return showView("board"); }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.pi) {
      const [rk, i] = t.dataset.pi.split(","); const v = parseInt(t.value, 10);
      state.prices[rk][+i] = Number.isFinite(v) && v >= 0 ? Math.min(999, v) : null; t.value = state.prices[rk][+i] ?? "";
      markReal(); save(); if (state.view === "board") renderBoardKeepFocus(); else refreshLiveCharts();
    }
    if (t.dataset.bm) {
      const [rk, i] = t.dataset.bm.split(","); const v = parseInt(t.value, 10);
      state.missions[rk][+i] = Number.isFinite(v) && v >= 0 ? Math.min(99, v) : 0;
      markReal(); save(); renderBoardKeepFocus();
    }
  });
  document.addEventListener("keydown", e => {
    if (state.view !== "play" || e.target.closest("input")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); goStage(state.stage + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goStage(state.stage - 1); }
  });
}
function renderBoardKeepFocus() {
  const id = document.activeElement && document.activeElement.id;
  renderBoard();
  const el = id && document.getElementById(id); if (el) el.focus();
}
function markReal() { if (state.example) { state.example = false; $("#banner").hidden = true; } }
function giftAnim(btn) {
  btn.disabled = true;
  const num = $("#gift-num"), pile = $("#gift-pile"); let n = 30;
  const step = () => {
    n += 2; num.textContent = n;
    pile.insertAdjacentHTML("beforeend", icon("shell") + icon("shell"));
    if (n < 90) setTimeout(step, 45); else btn.textContent = "마을마다 조개 90개!";
  };
  step();
}

/* ---------------- 시작 ---------------- */
function boot(data) {
  state = (data && data.state) || load();
  if (state.example && state.missions.r1.every(v => v === 0) && state.prices.r2.every(v => v == null)) Object.assign(state, withExample());
  brand(); bind();
  $("#btn-notes").setAttribute("aria-pressed", state.notes);
  showView(state.view || "play");
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ state })); } catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
